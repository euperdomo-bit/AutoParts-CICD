# Valores de SonarCloud
sonar.organization=euperdomo-bit
sonar.projectKey=euperdomo-bit_AutoParts-CICD

# Qué analizar: todo el repo (Python del backend, JS del frontend y el Dockerfile)
sonar.sources=.
sonar.python.version=3.13

# Las pruebas se marcan como tales (Sonar no las cuenta como código de producción)
sonar.tests=backend/tienda/tests.py
sonar.test.inclusions=backend/tienda/tests.py
sonar.exclusions=backend/tienda/tests.py,**/migrations/**,**/staticfiles/**,frontend/static/lib/**,**/*.min.js,**/*.min.css,backend/media/**,backend/db.sqlite3,backend/backend/media/**,backend/db.sqlite3,backend/backend
