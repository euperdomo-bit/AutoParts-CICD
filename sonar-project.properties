# Reemplaza estos dos valores con los que te muestra SonarCloud al crear el proyecto
sonar.organization=TU_ORGANIZACION_SONAR
sonar.projectKey=TU_ORGANIZACION_SONAR_AutoPartss

# Qué analizar: todo el repo (Python del backend, JS del frontend y el Dockerfile)
sonar.sources=.
sonar.python.version=3.13

# Las pruebas se marcan como tales (Sonar no las cuenta como código de producción)
sonar.tests=backend/tienda/tests.py
sonar.test.inclusions=backend/tienda/tests.py
sonar.exclusions=backend/tienda/tests.py,**/migrations/**,**/staticfiles/**,frontend/static/lib/**,**/*.min.js,**/*.min.css,backend/media/**,backend/db.sqlite3,backend/backend
